[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docunderstand"
version = "0.1.0"
description = "Visually rich document understanding companion library for infoextract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }
authors = [{ name = "David Spencer" }]
keywords = ["document", "understanding", "vrdu", "pdf", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "mypy>=1.8.0",
    "bandit[toml]>=1.7.0",
    "pre-commit>=3.6.0",
    "ruff==0.15.4",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=1.0.0",
]

[project.scripts]
docunderstand = "docunderstand:main"

[project.urls]
Homepage = "https://github.com/DecisionNerd/docunderstand"
Repository = "https://github.com/DecisionNerd/docunderstand"
Issues = "https://github.com/DecisionNerd/docunderstand/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docunderstand"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PL",   # Pylint
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "SIM108",  # Use ternary operator instead of if-else
    "RET504",  # Unnecessary variable assignment before return
    "ARG002",  # Unused method argument
    "RET505",  # Unnecessary else after return
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "SIM102",  # Use single if statement
    "SIM103",  # Return condition directly
    "SIM110",  # Use any() instead of for loop
    "PERF401", # Use list.extend
    "B905",    # zip() without strict parameter
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Unused function argument (fixtures)
    "PLR2004", # Magic value in comparison (test values)
    "S101",    # Use of assert
    "PTH123",  # Use Path.open()
    "E501",    # Line too long
    "E741",    # Ambiguous variable names
    "SIM105",  # Use contextlib.suppress
]

[tool.ruff.lint.isort]
known-first-party = ["docunderstand"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.bandit]
exclude_dirs = ["tests/", ".venv/", "build/", "dist/"]
skips = ["B101"]

[tool.bandit.assert_used]
skips = ["**/tests/**", "**/*_test.py", "**/conftest.py"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
norecursedirs = [".git", ".venv", "dist", "build", "*.egg"]
markers = [
    "unit: fast, isolated unit tests with no I/O",
    "integration: tests that use real backends, filesystems, or external services",
    "slow: tests that take longer than 1 second",
    "pdf: tests specific to PDF document processing",
    "image: tests specific to image document processing",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py", "*/conftest.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
]
